    <meta charset="UTF-8">

    <meta name="widget-name" content="Actualités">

    <style>
        :root {
            --bk-red: #D62300;
            --bk-red-dark: #B01E00;
            --bk-gold: #F5BD1F;
            --bk-gold-deep: #E0A500;
            --bk-orange: #FF8732;
            --bk-brown: #6E6557;
            --cream: #FCF6E0;
            --app-bg: #F0F0F2;
            --text: #1a1a1a;
            --text-light: #6b7280;
            --card: #ffffff;
            --border: #e5e7eb;
            --green: #178A3D;
            --blue: #1877F2;
            --shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--app-bg);
            color: var(--text);
            padding: 0 0 1.5rem;
            max-width: 480px;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
        }

        .wrap { padding: 1rem; }

        /* Greeting */
        .greet {
            background: var(--bk-red);
            color: #fff; border-radius: 14px;
            padding: 0.95rem 1.2rem; margin-bottom: 1rem;
            font-size: 1.25rem; font-weight: 800;
        }

        /* Tabs */
        .tabs {
            display: flex; background: #fff; border: 1.5px solid var(--bk-orange);
            border-radius: 999px; padding: 4px; margin-bottom: 1.1rem;
        }
        .tab {
            flex: 1; border: none; background: transparent; cursor: pointer;
            font-family: inherit; font-weight: 700; font-size: 0.92rem; color: var(--text);
            padding: 0.6rem 0.4rem; border-radius: 999px; white-space: nowrap;
            transition: background .15s, color .15s;
        }
        .tab.active { background: var(--bk-orange); color: #fff; }

        /* Cards */
        .feed { display: flex; flex-direction: column; gap: 1rem; }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
        }
        .hero { position: relative; line-height: 0; }
        .hero img { width: 100%; display: block; }
        .src-badge {
            position: absolute; top: 0.7rem; right: 0.7rem;
            background: var(--bk-orange); color: #fff;
            font-size: 0.72rem; font-weight: 800; letter-spacing: 0.03em;
            padding: 0.3rem 0.6rem; border-radius: 8px;
            display: inline-flex; align-items: center; gap: 0.3rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
        }
        .src-badge svg { width: 13px; height: 13px; }

        .body { padding: 1.1rem; }

        .badges { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.7rem; }
        .badge {
            font-size: 0.82rem; font-weight: 700; padding: 0.35rem 0.85rem; border-radius: 999px;
            display: inline-flex; align-items: center; gap: 0.3rem;
        }
        .badge.important { background: var(--bk-red); color: #fff; }
        .badge.confirm { background: #FCEEDF; color: #8a5a1e; }

        .title { font-size: 1.2rem; font-weight: 800; line-height: 1.2; margin-bottom: 0.4rem; }
        .meta { font-size: 0.92rem; color: var(--text-light); margin-bottom: 0.7rem; line-height: 1.4; }
        .meta .src { color: var(--bk-red); font-weight: 800; }
        .excerpt { font-size: 1rem; line-height: 1.5; color: #2b2b2b; }

        .stats {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 0.9rem; font-size: 0.92rem; color: var(--text-light);
        }
        .reacts { display: flex; align-items: center; gap: 0.4rem; }
        .react-ic {
            width: 22px; height: 22px; border-radius: 50%; color: #fff;
            display: inline-flex; align-items: center; justify-content: center; margin-left: -6px;
            border: 2px solid #fff;
        }
        .react-ic:first-child { margin-left: 0; }
        .react-ic svg { width: 12px; height: 12px; }
        .react-ic.like { background: var(--blue); }
        .react-ic.bravo { background: var(--green); }

        hr.sep { border: none; border-top: 1px solid var(--border); margin: 0.85rem 0 0; }
        .actions { display: flex; justify-content: space-around; padding-top: 0.65rem; }
        .act {
            display: flex; align-items: center; gap: 0.4rem; cursor: pointer;
            background: none; border: none; font-family: inherit;
            font-size: 0.95rem; font-weight: 700; color: var(--text-light);
            padding: 0.35rem 0.5rem; border-radius: 8px; transition: color .12s;
        }
        .act svg { width: 19px; height: 19px; }
        .act:active { transform: scale(0.96); }
        .act.on.like { color: var(--blue); }
        .act.on.bravo { color: var(--green); }
        .act.on.fav { color: var(--bk-gold-deep); }

        .empty { text-align: center; color: var(--text-light); padding: 2.5rem 1rem; }

        /* Comments */
        .stat-cmt { cursor: pointer; }
        .stat-cmt:hover { color: var(--bk-red); }
        .comments { display: none; border-top: 1px solid var(--border); margin-top: 0.65rem; padding-top: 0.9rem; }
        .comments.open { display: block; }
        .comment { display: flex; gap: 0.6rem; margin-bottom: 0.85rem; }
        .avatar {
            width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 800; overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .c-bubble { background: var(--app-bg); border-radius: 12px; padding: 0.55rem 0.75rem; flex: 1; }
        .c-bubble .c-name { font-weight: 800; font-size: 0.88rem; }
        .c-bubble .c-text { font-size: 0.92rem; line-height: 1.4; margin-top: 0.1rem; }
        .c-time { font-size: 0.75rem; color: var(--text-light); margin: 0.2rem 0 0 0.75rem; }
        .c-form { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.3rem; }
        .c-form input {
            flex: 1; border: 1.5px solid var(--border); border-radius: 999px;
            padding: 0.6rem 0.9rem; font-size: 0.92rem; font-family: inherit; outline: none; color: var(--text);
        }
        .c-form input:focus { border-color: var(--bk-red); }
        .c-send {
            border: none; background: var(--bk-red); color: #fff; cursor: pointer;
            width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .c-send svg { width: 18px; height: 18px; }
        .c-send:disabled { background: #d1d5db; cursor: not-allowed; }
    </style>
</head>

        function avatarHTML(n) {
            if (PHOTOS[n]) return '<div class="avatar"><img src="' + PHOTOS[n] + '" alt=""></div>';
            return '<div class="avatar" style="background:' + avColor(n) + '">' + esc(initials(n)) + '</div>';
        }
        const RTF_FR = new Intl.RelativeTimeFormat('fr-FR', { numeric: 'auto' });
        function agoFr(h) { if (h <= 0) return "À l'instant"; return h >= 24 ? RTF_FR.format(-Math.round(h / 24), 'day') : RTF_FR.format(-h, 'hour'); }
        function commentRow(c) {
            return '<div class="comment">' + avatarHTML(c.n)
                 + '<div style="flex:1"><div class="c-bubble"><div class="c-name">' + esc(c.n) + '</div><div class="c-text">' + esc(c.txt) + '</div></div>'
                 + '<div class="c-time">' + esc(agoFr(c.h)) + '</div></div></div>';
        }

        function cardHTML(it, i) {
            const date = dateLabel(it.daysAgo, it.hh, it.mm);
            const isBravo = it.react.indexOf('bravo') !== -1;
            const likeIcon = isBravo ? ICON.bravo : ICON.thumbOutline;
            const likeLabel = isBravo ? t.bravo : t.like;
            const likeCls = isBravo ? 'bravo' : 'like';
            let inner = '';
            if (it.kind === 'image') {
                inner += '<div class="hero"><img src="' + HERO[it.img] + '" alt=""><span class="src-badge">' + ICON.building + esc(t.natSource) + '</span></div>';
            }
            inner += '<div class="body">';
            if (it.badges) {
                inner += '<div class="badges">';
                if (it.badges.indexOf('important') !== -1) inner += '<span class="badge important">' + esc(t.badgeImportant) + '</span>';
                if (it.badges.indexOf('confirm') !== -1) inner += '<span class="badge confirm">' + ICON.hourglass + esc(t.badgeConfirm) + '</span>';
                inner += '</div>';
            }
            // National (image) cards carry their title baked into the hero — don't repeat it.
            if (it.kind !== 'image') inner += '<div class="title">' + esc(t[it.titleKey]) + '</div>';
            const src = it.cat === 'nat' ? t.natSource : t.locSource;
            inner += '<div class="meta">' + esc(date) + ' - <span class="src">' + esc(src) + '</span></div>';
            inner += '<p class="excerpt">' + esc(t[it.bodyKey]) + '</p>';
            const cmts = it.cmts || [];
            inner += '<div class="stats"><span class="reacts">' + reactStack(it.react) + ' <span class="like-count">' + it.likes + '</span></span>'
                   + '<span class="stat-cmt"><span class="cmt-count">' + cmts.length + '</span> ' + esc(t.comments) + '</span></div>';
            inner += '<hr class="sep">';
            inner += '<div class="actions">'
                   + '<button class="act ' + likeCls + '" data-act="like"><span class="ic">' + likeIcon + '</span><span>' + esc(likeLabel) + '</span></button>'
                   + '<button class="act" data-act="comment">' + ICON.comment + '<span>' + esc(t.comment) + '</span></button>'
                   + '<button class="act fav" data-act="fav"><span class="ic">' + ICON.star + '</span><span>' + esc(t.fav) + '</span></button>'
                   + '</div>';
            inner += '<div class="comments">'
                   + '<div class="comment-list">' + cmts.map(commentRow).join('') + '</div>'
                   + '<div class="c-form"><input type="text" placeholder="' + esc(t.cmtPlaceholder) + '" maxlength="280">'
                   + '<button class="c-send" data-act="send" disabled>' + ICON.send + '</button></div>'
                   + '</div>';
            inner += '</div>';
            const art = document.createElement('article');
            art.className = 'card';
            art.dataset.cat = it.cat;
            art.dataset.likes = it.likes;
            art.dataset.bravo = isBravo ? '1' : '';
            art.innerHTML = inner;
            return art;
        }

        const feed = document.getElementById('feed');
        function render(cat) {
            feed.innerHTML = '';
            const list = ITEMS.filter(it => cat === 'all' || it.cat === cat);
            if (!list.length) { feed.innerHTML = '<div class="empty">' + esc(t.empty) + '</div>'; return; }
            list.forEach((it, i) => feed.appendChild(cardHTML(it, i)));
        }
        render('all');

        // Tabs
        const tabs = document.getElementById('tabs');
        tabs.addEventListener('click', e => {
            const b = e.target.closest('.tab'); if (!b) return;
            tabs.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
            render(b.dataset.cat);
        });

        const ME = 'Karim B.'; // logged-in persona (matches the greeting)

        function toggleComments(card, force) {
            const panel = card.querySelector('.comments');
            const open = force !== undefined ? force : !panel.classList.contains('open');
            panel.classList.toggle('open', open);
            if (open) { const inp = panel.querySelector('input'); if (inp) setTimeout(() => inp.focus(), 0); }
        }
        function postComment(card) {
            const inp = card.querySelector('.c-form input');
            const txt = inp.value.trim(); if (!txt) return;
            const row = document.createElement('div');
            row.innerHTML = commentRow({ n: ME, h: 0, txt: txt });
            card.querySelector('.comment-list').appendChild(row.firstChild);
            const cnt = card.querySelector('.cmt-count');
            if (cnt) cnt.textContent = (+cnt.textContent + 1);
            inp.value = '';
            card.querySelector('.c-send').disabled = true;
        }

        // Interactions: like/bravo, favoris, open comments, post comment
        feed.addEventListener('click', e => {
            const stat = e.target.closest('.stat-cmt');
            if (stat) { toggleComments(stat.closest('.card')); return; }
            const btn = e.target.closest('.act, .c-send'); if (!btn) return;
            const card = btn.closest('.card');
            const act = btn.dataset.act;
            if (act === 'like') {
                const on = btn.classList.toggle('on');
                const base = +card.dataset.likes;
                const cnt = card.querySelector('.like-count');
                if (cnt) cnt.textContent = on ? base + 1 : base;
            } else if (act === 'fav') {
                const on = btn.classList.toggle('on');
                const ic = btn.querySelector('.ic');
                if (ic) ic.innerHTML = on ? ICON.starFill : ICON.star;
            } else if (act === 'comment') {
                toggleComments(card);
            } else if (act === 'send') {
                postComment(card);
            }
        });
        feed.addEventListener('input', e => {
            const inp = e.target.closest('.c-form input'); if (!inp) return;
            inp.closest('.c-form').querySelector('.c-send').disabled = !inp.value.trim();
        });
        feed.addEventListener('keydown', e => {
            const inp = e.target.closest('.c-form input'); if (!inp) return;
            if (e.key === 'Enter') { e.preventDefault(); postComment(inp.closest('.card')); }
        });
    })();
    </script>
</body>
</html>
