<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="widget-name" content="Document Library">
    <meta name="widget-description" content="Searchable document & video library with category filters and stat cards">
    <meta name="widget-tags" content="File Management, Communications, Learning">
    <title>Mes docs</title>
    <style>
        :root {
            --bk-red: #D62300;
            --bk-gold: #F5BD1F;
            --bk-gold-deep: #E0A500;
            --bk-orange: #FF8732;
            --bk-brown: #6E6557;
            --cream: #FCF6E0;
            --text: #1a1a1a;
            --text-light: #6b7280;
            --card: #ffffff;
            --search-bg: #ededed;
            --thumb-bg: #e9e9ee;
            --shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--cream);
            color: var(--text);
            padding: 1rem;
            max-width: 480px;
            margin: 0 auto;
        }

        /* Header */
        .cw-header {
            background: var(--bk-red);
            color: #fff;
            padding: 1.4rem 1.5rem;
            border-radius: 16px;
            margin-bottom: 1rem;
        }
        .cw-header h1 { font-size: 1.5rem; font-weight: 800; }

        /* Search */
        .cw-search {
            position: relative;
            margin-bottom: 1rem;
        }
        .cw-search svg {
            position: absolute;
            left: 1rem; top: 50%; transform: translateY(-50%);
            width: 20px; height: 20px; color: var(--text-light);
        }
        .cw-search input {
            width: 100%;
            border: none;
            background: var(--search-bg);
            border-radius: 14px;
            padding: 0.95rem 1rem 0.95rem 2.9rem;
            font-size: 1rem;
            color: var(--text);
            outline: none;
        }
        .cw-search input::placeholder { color: var(--text-light); }

        /* Category tabs */
        .cw-tabs-wrap {
            border: 1.5px solid var(--bk-red);
            border-radius: 14px;
            padding: 0.35rem;
            margin-bottom: 1rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .cw-tabs-wrap::-webkit-scrollbar { display: none; }
        .cw-tabs {
            display: flex;
            gap: 0.25rem;
            width: max-content;
        }
        .cw-tab {
            border: none;
            background: transparent;
            color: var(--text);
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
        }
        .cw-tab.active {
            background: var(--bk-red);
            color: #fff;
        }

        /* Stat cards */
        .stat-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
            margin-bottom: 1.25rem;
        }
        .stat-card {
            border: 2px solid;
            border-radius: 16px;
            padding: 0.9rem 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s;
            background: var(--card);
        }
        .stat-card:active { transform: scale(0.97); }
        .stat-card.active { box-shadow: 0 0 0 3px rgba(214,35,0,0.15); }
        .stat-icon {
            width: 46px; height: 46px;
            border-radius: 12px;
            margin: 0 auto 0.55rem;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
        }
        .stat-icon svg { width: 24px; height: 24px; }
        .stat-label { font-weight: 700; font-size: 0.9rem; color: var(--text); }
        .stat-value { font-weight: 800; font-size: 1.15rem; margin-top: 0.15rem; }

        .stat-card.videos { border-color: var(--bk-red); background: linear-gradient(160deg,#fff, #fdece9); }
        .stat-card.videos .stat-icon { background: var(--bk-red); }
        .stat-card.videos .stat-value { color: var(--bk-red); }

        .stat-card.docs { border-color: var(--bk-gold); background: linear-gradient(160deg,#fff,#fdf8e3); }
        .stat-card.docs .stat-icon { background: var(--bk-gold-deep); }
        .stat-card.docs .stat-value { color: var(--bk-red); }

        .stat-card.updates { border-color: var(--bk-orange); background: linear-gradient(160deg,#fff,#fff1e3); }
        .stat-card.updates .stat-icon { background: var(--bk-orange); }
        .stat-card.updates .stat-value { color: var(--bk-orange); }

        /* Document list */
        .doc-list { display: flex; flex-direction: column; gap: 0.85rem; }
        .doc-card {
            background: var(--card);
            border-radius: 16px;
            padding: 0.9rem;
            box-shadow: var(--shadow);
            display: flex;
            gap: 0.85rem;
        }
        .doc-thumb {
            width: 92px; min-width: 92px; height: 92px;
            border-radius: 12px;
            background: var(--thumb-bg);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            overflow: hidden;
            color: #9aa0aa;
        }
        .doc-thumb svg { width: 38px; height: 38px; }
        .doc-thumb.video {
            background: linear-gradient(135deg,#3a3a3a,#6e6557);
            background-size: cover;
            background-position: center;
        }
        .doc-card.clickable { cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; }
        .doc-card.clickable:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.14); }
        .doc-card.clickable:active { transform: scale(0.99); }

        /* Viewer modal */
        .cw-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.82);
            display: none; align-items: center; justify-content: center;
            padding: 1rem; z-index: 1000;
        }
        .cw-modal.open { display: flex; }
        .cw-modal-box {
            background: #fff; border-radius: 16px;
            width: 100%; max-width: 720px;
            overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .cw-modal-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 0.5rem; padding: 0.75rem 0.5rem 0.75rem 1rem;
            background: var(--bk-red); color: #fff;
        }
        .cw-modal-title { font-weight: 800; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cw-modal-close {
            border: none; background: transparent; color: #fff;
            font-size: 1.8rem; line-height: 1; cursor: pointer;
            width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
        }
        .cw-modal-close:hover { background: rgba(255,255,255,0.2); }
        .cw-video-frame { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .cw-video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
        .cw-pdf { max-height: 70vh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #525659; padding: 0.5rem; }
        .cw-pdf canvas, .cw-doc-img { display: block; margin: 0 auto 0.5rem; max-width: 100%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        .cw-pdf-loading, .cw-pdf-error { color: #fff; text-align: center; padding: 2.5rem 1rem; font-size: 0.9rem; }
        .cw-pdf-detail {
            margin: 0.75rem auto 0; max-width: 90%;
            font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem;
            color: #ffd9d0; background: rgba(0,0,0,0.25);
            padding: 0.5rem 0.7rem; border-radius: 8px; word-break: break-word;
        }
        .cw-pdf-open {
            display: block; margin: 1.25rem auto 0; border: none; cursor: pointer;
            background: #fff; color: var(--bk-red); font-weight: 700; font-size: 0.9rem;
            padding: 0.6rem 1.4rem; border-radius: 10px;
        }
        .cw-doc-actions { padding: 0.75rem; text-align: center; background: #fff; border-top: 1px solid var(--border, #e5e7eb); }
        .cw-doc-actions a {
            display: inline-block; background: var(--bk-red); color: #fff;
            text-decoration: none; font-weight: 700; font-size: 0.9rem;
            padding: 0.6rem 1.4rem; border-radius: 10px;
        }
        .cw-doc-actions a:active { transform: scale(0.98); }
        .play-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--bk-red);
            display: flex; align-items: center; justify-content: center;
        }
        .play-btn svg { width: 18px; height: 18px; color: #fff; margin-left: 2px; }
        .duration {
            position: absolute;
            bottom: 6px; right: 6px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.12rem 0.35rem;
            border-radius: 5px;
            display: flex; align-items: center; gap: 0.2rem;
        }
        .duration svg { width: 10px; height: 10px; }

        .doc-body { flex: 1; min-width: 0; }
        .doc-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
            margin-bottom: 0.35rem;
        }
        .badge-rh { background: #ede9fe; color: #7c3aed; }
        .badge-operations { background: #dcfce7; color: #15803d; }
        .badge-securite { background: #fee2e2; color: #dc2626; }
        .badge-tutos { background: #dbeafe; color: #2563eb; }
        .badge-marketing { background: #ffedd5; color: #c2410c; }

        .doc-title { font-weight: 800; font-size: 1.02rem; line-height: 1.2; margin-bottom: 0.2rem; }
        .doc-desc {
            font-size: 0.88rem; color: var(--text-light); line-height: 1.3;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .doc-meta {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 0.6rem; gap: 0.5rem;
        }
        .doc-author { font-weight: 700; font-size: 0.82rem; color: var(--bk-brown); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .doc-date { font-size: 0.82rem; color: var(--text-light); white-space: nowrap; }

        .empty {
            text-align: center;
            color: var(--text-light);
            padding: 2.5rem 1rem;
            font-size: 0.95rem;
        }
    </style>
</head>

            }
        };
        function pickLang() {
            const q = new URLSearchParams(location.search).get('lang');
            const raw = (q || document.documentElement.lang || navigator.language || 'fr');
            if (T[raw]) return raw;
            const base = raw.toLowerCase().split('-')[0];
            if (base === 'en') return /gb|uk/i.test(raw) ? 'en-GB' : 'en-US';
            return T[base] ? base : 'fr';
        }
        const LANG = pickLang();
        const t = T[LANG] || T['fr'];
        document.documentElement.lang = LANG;

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.dataset.i18n; if (t[k] !== undefined) el.textContent = t[k];
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const k = el.dataset.i18nPh; if (t[k] !== undefined) el.placeholder = t[k];
            });
        }

        /* ---------- date helpers (runtime-anchored, never hardcoded) ---------- */
        const now = new Date();
        const daysAgo = n => { const d = new Date(now); d.setDate(d.getDate() - n); return d; };
        const fmtDate = d => new Intl.DateTimeFormat(LANG, { day: 'numeric', month: 'short', year: 'numeric' }).format(d);

        /* ---------- mock data (titles/authors are real doc names, not translated) ---------- */
        const CATS = ['tutos', 'operations', 'rh', 'securite', 'marketing'];
        const catLabelKey = { tutos: 'tabTutos', operations: 'tabOperations', rh: 'tabRH', securite: 'tabSecurite', marketing: 'tabMarketing' };

        const docs = [
            { type: 'doc',   category: 'rh',         daysAgo: 3,  author: 'Direction RH',
              title: "Guide de l'équipier 2026", desc: 'Toutes les informations RH : congés, rémunération, avantages',
              url: 'guide-equipier-2026.pdf', pagesKey: 'guide-equipier-2026' },
            { type: 'doc',   category: 'operations', daysAgo: 1,  author: 'Direction Opérations',
              title: 'Standards de qualité 2026', desc: 'Guide complet des standards de qualité et procédures opérationnelles' },
            { type: 'video', category: 'securite',   daysAgo: 5,  author: 'Sécurité Alimentaire', duration: '18:45',
              title: 'Procédures de sécurité alimentaire', desc: 'Formation obligatoire sur les normes HACCP et la sécurité en cuisine' },
            { type: 'video', category: 'tutos',      daysAgo: 2,  author: 'Équipe Formation',     duration: '06:30',
              title: 'Préparation du Whopper', desc: 'Tutoriel pas à pas pour assembler un Whopper aux standards de la marque' },
            { type: 'doc',   category: 'securite',   daysAgo: 9,  author: 'Direction Sécurité',
              title: 'Manuel HACCP 2026', desc: 'Plan de maîtrise sanitaire et points de contrôle critiques en restaurant' },
            { type: 'video', category: 'operations', daysAgo: 6,  author: 'Direction Opérations', duration: '09:15',
              title: 'Nettoyage et fermeture', desc: 'Checklist vidéo des procédures de nettoyage et de fermeture du restaurant',
              youtube: 'PuXKXFLJhxE' },
            { type: 'doc',   category: 'marketing',  daysAgo: 12, author: 'Service Marketing',
              title: 'Charte de marque 2026', desc: 'Logos, couleurs et règles d’usage de la marque pour les supports en restaurant' }
        ];
        docs.forEach((d, i) => { d.id = i; });

        /* normalize: lowercase + strip accents, so "nettoyage" matches "Nettoyage", "securite" matches "Sécurité" */
        const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '');

        /* ---------- state ---------- */
        const state = { category: 'tous', type: null, weekOnly: false, query: '' };

        /* ---------- render ---------- */
        function renderTabs() {
            const tabs = document.getElementById('tabs');
            const all = [{ key: 'tous', label: t.tabAll }].concat(
                CATS.map(c => ({ key: c, label: t[catLabelKey[c]] }))
            );
            tabs.innerHTML = all.map(x =>
                `<button class="cw-tab${state.category === x.key ? ' active' : ''}" data-cat="${x.key}">${x.label}</button>`
            ).join('');
            tabs.querySelectorAll('.cw-tab').forEach(b => b.addEventListener('click', () => {
                state.category = b.dataset.cat; renderTabs(); renderList();
            }));
        }

        function renderStats() {
            document.getElementById('count-videos').textContent = docs.filter(d => d.type === 'video').length;
            document.getElementById('count-docs').textContent = docs.filter(d => d.type === 'doc').length;
            document.querySelectorAll('.stat-card[data-type]').forEach(c => {
                c.classList.toggle('active', state.type === c.dataset.type);
            });
            document.querySelector('.stat-card[data-week]').classList.toggle('active', state.weekOnly);
        }

        const docIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg>';
        const playIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        const clockIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

        function renderList() {
            const q = norm(state.query.trim());
            const items = docs.filter(d =>
                (state.category === 'tous' || d.category === state.category) &&
                (!state.type || d.type === state.type) &&
                (!state.weekOnly || d.daysAgo <= 7) &&
                (!q || norm(d.title + ' ' + d.desc + ' ' + d.author + ' ' + t[catLabelKey[d.category]]).includes(q))
            );
            const list = document.getElementById('list');
            if (!items.length) { list.innerHTML = `<div class="empty">${t.empty}</div>`; return; }
            list.innerHTML = items.map(d => {
                const hasContent = !!(d.youtube || d.url);
                const bg = d.youtube ? ` style="background-image:url('https://i.ytimg.com/vi/${d.youtube}/hqdefault.jpg')"` : '';
                const thumb = d.type === 'video'
                    ? `<div class="doc-thumb video"${bg}><div class="play-btn">${playIcon}</div><span class="duration">${clockIcon}${d.duration}</span></div>`
                    : `<div class="doc-thumb">${docIcon}</div>`;
                return `<div class="doc-card${hasContent ? ' clickable' : ''}" data-id="${d.id}">
                    ${thumb}
                    <div class="doc-body">
                        <span class="doc-badge badge-${d.category}">${t[catLabelKey[d.category]]}</span>
                        <div class="doc-title">${d.title}</div>
                        <div class="doc-desc">${d.desc}</div>
                        <div class="doc-meta">
                            <span class="doc-author">${d.author}</span>
                            <span class="doc-date">${fmtDate(daysAgo(d.daysAgo))}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');

            list.querySelectorAll('.doc-card.clickable').forEach(card => {
                card.addEventListener('click', () => {
                    const d = docs.find(x => x.id == card.dataset.id);
                    if (!d) return;
                    if (d.youtube) {
                        // Many YouTube videos disable embedding (error 150/153) — open directly in the YouTube app / browser.
                        openExternal('https://www.youtube.com/watch?v=' + d.youtube);
                    } else if (d.pagesKey && window.DOC_PAGES && window.DOC_PAGES[d.pagesKey]) {
                        // Preferred: pages pre-rendered to inline base64 images. No external script/worker/fetch,
                        // so it survives the Staffbase webview CSP that blocks external <script src> and resources.
                        openDocImages(d);
                    } else if (d.url) {
                        const isAbsolute = /^https?:\/\//i.test(d.url);
                        const sameOrigin = !isAbsolute || d.url.indexOf(location.origin + '/') === 0;
                        if (sameOrigin) openViewer(d);   // same-origin PDF → inline PDF.js
                        else openInApp(d.url);            // cross-origin (e.g. Staffbase) → open in app
                    }
                });
            });
        }

        /* Open an external URL reliably across browsers and mobile webviews (iOS Staffbase app, etc.).
           A synthesized <a target="_blank"> click is honored in more sandboxed contexts than window.open();
           falls back to top-frame navigation if popups are blocked. */
        /* Open a URL that belongs to the Staffbase app itself (same domain as the host app, so already
           authenticated). Navigate the TOP app frame (target=_top) rather than spawning a new browser
           tab — a new tab has no session cookies and a "secure" media URL would 307 to the login page. */
        function openInApp(url) {
            try {
                const a = document.createElement('a');
                a.href = url; a.target = '_top'; a.rel = 'noopener';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) {
                try { window.top.location.href = url; } catch (_) { window.location.href = url; }
            }
        }

        function openExternal(url) {
            try {
                const a = document.createElement('a');
                a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) {
                try { (window.top || window).location.href = url; } catch (_) { window.location.href = url; }
            }
        }

        /* Show a document as pre-rendered inline images (base64 data-URIs). Fully self-contained:
           no external script, no worker, no fetch — works under the Staffbase webview CSP. */
        function openDocImages(d) {
            const modal = document.getElementById('viewer');
            const body = document.getElementById('viewer-body');
            document.getElementById('viewer-title').textContent = d.title;
            const pages = (window.DOC_PAGES && window.DOC_PAGES[d.pagesKey]) || [];
            const imgs = pages.map(src => `<img class="cw-doc-img" src="${src}" alt="">`).join('');
            const dl = d.url ? `<div class="cw-doc-actions"><a href="${d.url}" download>${t.downloadDoc}</a></div>` : '';
            body.innerHTML = `<div class="cw-pdf">${imgs}</div>` + dl;
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        /* ---------- viewer (modal) — documents only; videos open directly on YouTube ---------- */
        function openViewer(d) {
            const modal = document.getElementById('viewer');
            const body = document.getElementById('viewer-body');
            document.getElementById('viewer-title').textContent = d.title;
            const fileName = (d.title || 'document').replace(/[\\/:*?"<>|]+/g, ' ').trim() + '.pdf';
            body.innerHTML =
                `<div class="cw-pdf" id="pdf-pages"><div class="cw-pdf-loading">${t.docLoading}</div></div>` +
                `<div class="cw-doc-actions"><a href="${d.url}" download="${fileName}">${t.downloadDoc}</a></div>`;
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
            renderPdf(d.url);
        }

        /* Render a PDF to canvases with PDF.js — works inside iOS webviews where <iframe src=pdf> shows blank.
           PDF.js is self-hosted (same-origin) so it loads even when the Staffbase embed sandbox/CSP blocks
           external CDN scripts, popups, downloads and top-navigation. Everything stays inside the iframe. */
        const PDFJS_LIB = 'vendor/pdfjs/pdf.min.js';
        const PDFJS_WORKER = 'vendor/pdfjs/pdf.worker.min.js';
        function renderPdf(url) {
            const container = document.getElementById('pdf-pages');
            let done = false;
            let stage = 'init';
            // DIAGNOSTIC fallback: shows the exact reason on screen so we can see why it fails in the
            // Staffbase iOS webview (blocked script / missing lib / worker / sandbox origin / timeout).
            const fallback = (reason) => {
                if (done) return; done = true;
                const detail = reason ? `<div class="cw-pdf-detail">⚙︎ ${String(reason).slice(0, 300)}</div>` : '';
                container.innerHTML = `<div class="cw-pdf-error">${t.docError}${detail}<button class="cw-pdf-open" id="pdf-open">${t.openDoc}</button></div>`;
                const b = document.getElementById('pdf-open');
                if (b) b.addEventListener('click', () => openExternal(url));
            };
            const timer = setTimeout(() => fallback('timeout 12s (étape: ' + stage + ')'), 12000);
            const draw = () => {
                if (done) return;
                if (!window.pdfjsLib) { clearTimeout(timer); return fallback('pdfjsLib introuvable après chargement du script'); }
                try { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; } catch (e) { clearTimeout(timer); return fallback('workerSrc: ' + (e && e.message || e)); }
                stage = 'getDocument';
                let task;
                try { task = pdfjsLib.getDocument(url); } catch (e) { clearTimeout(timer); return fallback('getDocument(): ' + (e && e.message || e)); }
                task.promise.then(async pdf => {
                    if (done) return; done = true; clearTimeout(timer);
                    stage = 'render';
                    container.innerHTML = '';
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({ scale: 1.5 });
                        const canvas = document.createElement('canvas');
                        canvas.width = viewport.width * dpr;
                        canvas.height = viewport.height * dpr;
                        canvas.style.width = '100%';
                        canvas.style.height = 'auto';
                        container.appendChild(canvas);
                        await page.render({ canvasContext: canvas.getContext('2d'), viewport, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
                    }
                }).catch(e => { clearTimeout(timer); done = false; fallback((e && e.name ? e.name + ': ' : '') + (e && e.message || e)); });
            };
            stage = 'load-script';
            if (window.pdfjsLib) { draw(); return; }
            const s = document.createElement('script');
            s.src = PDFJS_LIB;
            s.onload = draw;
            s.onerror = () => { clearTimeout(timer); fallback('échec de chargement de ' + PDFJS_LIB + ' (script bloqué par le sandbox/CSP ?)'); };
            document.head.appendChild(s);
        }
        function closeViewer() {
            const modal = document.getElementById('viewer');
            modal.classList.remove('open');
            document.getElementById('viewer-body').innerHTML = ''; // stops the video / frees the iframe
            document.body.style.overflow = '';
        }

        function init() {
            applyTranslations();
            renderTabs();
            renderStats();
            renderList();

            document.getElementById('search').addEventListener('input', e => {
                state.query = e.target.value; renderList();
            });
            document.querySelectorAll('.stat-card[data-type]').forEach(c => c.addEventListener('click', () => {
                state.type = state.type === c.dataset.type ? null : c.dataset.type;
                renderStats(); renderList();
            }));
            document.querySelector('.stat-card[data-week]').addEventListener('click', () => {
                state.weekOnly = !state.weekOnly; renderStats(); renderList();
            });

            const modal = document.getElementById('viewer');
            document.getElementById('viewer-close').addEventListener('click', closeViewer);
            modal.addEventListener('click', e => { if (e.target === modal) closeViewer(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) closeViewer(); });
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>

</body>
