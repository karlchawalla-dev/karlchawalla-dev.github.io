<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="widget-name" content="Signalement">
    <meta name="widget-description" content="Confidential incident reporting — pick a category, date, location, optional details; HR receives it">
    <meta name="widget-tags" content="Safety, HR Data, Communications">
    <title>Signalement</title>
    <style>
        :root {
            --bk-red: #D62300;
            --bk-red-dark: #B01E00;
            --bk-gold: #F5BD1F;
            --bk-gold-deep: #E0A500;
            --bk-orange: #FF8732;
            --bk-brown: #6E6557;
            --cream: #FCF6E0;
            --text: #1a1a1a;
            --text-light: #6b7280;
            --card: #ffffff;
            --border: #e5e7eb;
            --green: #178A3D;
            --purple: #7C3AED;
            --shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--cream);
            color: var(--text);
            padding: 1rem;
            max-width: 480px;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
        }

        .cw-header {
            background: linear-gradient(120deg, var(--bk-red), var(--bk-red-dark));
            color: #fff;
            padding: 1.4rem 1.5rem;
            border-radius: 18px;
            margin-bottom: 1rem;
            display: flex; align-items: center; gap: 0.9rem;
        }
        .cw-header .h-ic { width: 34px; height: 34px; flex-shrink: 0; }
        .cw-header h1 { font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
        .cw-header p { font-size: 0.95rem; font-weight: 500; margin-top: 0.2rem; opacity: 0.95; }

        .notice {
            display: flex; gap: 0.7rem; align-items: flex-start;
            background: #fff; border: 1px solid var(--border);
            border-left: 4px solid var(--green);
            border-radius: 12px; padding: 0.85rem 1rem; margin-bottom: 1rem;
        }
        .notice svg { width: 22px; height: 22px; color: var(--green); flex-shrink: 0; }
        .notice b { display: block; font-size: 0.92rem; }
        .notice span { font-size: 0.85rem; color: var(--text-light); line-height: 1.35; }

        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 1.1rem; box-shadow: var(--shadow);
        }
        .field { margin-bottom: 1.15rem; }
        .field:last-child { margin-bottom: 0; }
        .field > label { display: block; font-weight: 800; font-size: 0.95rem; margin-bottom: 0.55rem; }
        .req { color: var(--bk-red); }

        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
        .cat-chip {
            border: 1.5px solid var(--border); background: #fff; border-radius: 12px;
            padding: 0.7rem 0.4rem; cursor: pointer; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
            font-family: inherit; font-size: 0.8rem; font-weight: 700; color: var(--text);
            transition: border-color .12s, background .12s, transform .1s;
        }
        .cat-chip:active { transform: scale(0.97); }
        .cat-chip .ci {
            width: 38px; height: 38px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; color: #fff;
        }
        .cat-chip .ci svg { width: 20px; height: 20px; }
        .cat-chip.sel { border-color: var(--bk-red); border-width: 2.5px; background: #fff6f4; }

        input[type="date"], select, textarea {
            width: 100%; border: 1.5px solid var(--border); border-radius: 12px;
            padding: 0.8rem 0.85rem; font-size: 0.95rem; font-family: inherit;
            color: var(--text); background: #fff; outline: none;
        }
        input[type="date"]:focus, select:focus, textarea:focus { border-color: var(--bk-red); }
        textarea { min-height: 96px; resize: vertical; }

        .btn-submit {
            width: 100%; border: none; border-radius: 14px; margin-top: 1.2rem;
            background: var(--bk-red); color: #fff; font-weight: 800; font-size: 1.05rem;
            padding: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            transition: filter .12s, transform .1s;
        }
        .btn-submit svg { width: 20px; height: 20px; }
        .btn-submit:hover { filter: brightness(0.95); }
        .btn-submit:active { transform: scale(0.99); }
        .btn-submit:disabled { background: #d1d5db; cursor: not-allowed; }
        .req-hint { font-size: 0.78rem; color: var(--text-light); margin-top: 0.6rem; text-align: center; }

        .anon {
            display: flex; gap: 0.6rem; align-items: flex-start; cursor: pointer;
            background: var(--cream); border: 1px solid var(--border); border-radius: 12px;
            padding: 0.8rem 0.9rem; margin-top: 0.2rem;
        }
        .anon input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--bk-red); flex-shrink: 0; }
        .anon b { display: block; font-size: 0.92rem; }
        .anon small { color: var(--text-light); font-size: 0.82rem; line-height: 1.3; }

        /* Confirmation */
        #confirm-view { display: none; text-align: center; padding: 1.5rem 1.2rem 2rem; }
        .check {
            width: 86px; height: 86px; border-radius: 50%;
            background: linear-gradient(160deg, #e8f8ef, #d2f0dd);
            display: flex; align-items: center; justify-content: center; margin: 0.5rem auto 1.1rem;
        }
        .check svg { width: 46px; height: 46px; color: var(--green); }
        #confirm-view h2 { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.6rem; }
        #confirm-view p { font-size: 1rem; color: #374151; line-height: 1.45; max-width: 340px; margin: 0 auto; }
        .ref {
            display: inline-block; margin: 1.1rem auto 0;
            background: #fff; border: 1px dashed var(--border); border-radius: 10px;
            padding: 0.5rem 0.9rem; font-size: 0.85rem; color: var(--text-light); font-weight: 700;
        }
        .ref b { color: var(--text); font-family: ui-monospace, Menlo, monospace; }
        .btn-new {
            margin-top: 1.5rem; border: 1.5px solid var(--bk-red); background: #fff; color: var(--bk-red);
            font-weight: 800; font-size: 0.95rem; padding: 0.8rem 1.4rem; border-radius: 12px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="cw-header">
        <svg class="h-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        <div>
            <h1 data-i18n="title">Signalement</h1>
            <p data-i18n="subtitle">Signaler un incident, en toute confidentialité</p>
        </div>
    </div>

    <div id="form-view">
        <div class="notice">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <div>
                <b data-i18n="noticeTitle">Confidentiel</b>
                <span data-i18n="noticeBody">Votre signalement est transmis à l'équipe RH et traité avec la plus grande confidentialité.</span>
            </div>
        </div>

        <div class="card">
            <div class="field">
                <label><span data-i18n="catLabel">Catégorie</span> <span class="req">*</span></label>
                <div class="cat-grid" id="cats"></div>
            </div>
            <div class="field">
                <label for="f-date"><span data-i18n="dateLabel">Date de l'incident</span> <span class="req">*</span></label>
                <input type="date" id="f-date">
            </div>
            <div class="field">
                <label for="f-place"><span data-i18n="placeLabel">Lieu</span> <span class="req">*</span></label>
                <select id="f-place"></select>
            </div>
            <div class="field">
                <label for="f-desc"><span data-i18n="descLabel">Description des faits</span> <span class="req">*</span></label>
                <textarea id="f-desc" data-i18n-ph="descPh" maxlength="600"></textarea>
            </div>
            <div class="field">
                <label for="f-people" data-i18n="peopleLabel">Personnes concernées (optionnel)</label>
                <textarea id="f-people" data-i18n-ph="peoplePh" maxlength="200"></textarea>
            </div>
            <label class="anon">
                <input type="checkbox" id="f-anon">
                <span>
                    <b data-i18n="anonLabel">Signalement anonyme</b>
                    <small data-i18n="anonHint">Votre identité ne sera pas transmise aux RH.</small>
                </span>
            </label>

            <button class="btn-submit" id="submit" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                <span data-i18n="submit">Envoyer le signalement</span>
            </button>
            <div class="req-hint" data-i18n="required">* Champs obligatoires</div>
        </div>
    </div>

    <div id="confirm-view" class="card">
        <div class="check">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h2 data-i18n="confirmTitle">Signalement envoyé</h2>
        <p data-i18n="confirmMsg">Votre demande est enregistrée et sera analysée par nos RH.</p>
        <div class="ref"><span data-i18n="refLabel">Référence</span> : <b id="ref-num"></b></div>
        <div><button class="btn-new" id="new-report" data-i18n="newReport">Nouveau signalement</button></div>
    </div>

    <script>
    (function () {
        const T = {
            'fr': {
                title: 'Signalement', subtitle: 'Signaler un incident, en toute confidentialité',
                noticeTitle: 'Confidentiel', noticeBody: 'Votre signalement est transmis à l\'équipe RH et traité avec la plus grande confidentialité.',
                catLabel: 'Catégorie', dateLabel: 'Date de l\'incident', placeLabel: 'Lieu', descLabel: 'Description des faits',
                catViolence: 'Violence', catDiscrim: 'Discrimination', catHarass: 'Harcèlement', catSafety: 'Sécurité', catTheft: 'Vol', catOther: 'Autre',
                placePh: 'Sélectionnez un lieu',
                plKitchen: 'Cuisine', plCounter: 'Comptoir / Caisse', plDining: 'Salle', plDrive: 'Drive', plLocker: 'Vestiaire', plStock: 'Réserve', plParking: 'Parking', plOther: 'Autre',
                descPh: 'Décrivez précisément ce qui s\'est passé.',
                peopleLabel: 'Personnes concernées (optionnel)', peoplePh: 'Nom(s), rôle(s)… (facultatif)',
                anonLabel: 'Signalement anonyme', anonHint: 'Votre identité ne sera pas transmise aux RH.',
                submit: 'Envoyer le signalement', required: '* Champs obligatoires',
                confirmTitle: 'Signalement envoyé', confirmMsg: 'Votre demande est enregistrée et sera analysée par nos RH.', refLabel: 'Référence', newReport: 'Nouveau signalement'
            },
            'en-US': {
                title: 'Report an Incident', subtitle: 'Report an incident, confidentially',
                noticeTitle: 'Confidential', noticeBody: 'Your report goes straight to the HR team and is handled with the utmost confidentiality.',
                catLabel: 'Category', dateLabel: 'Date of the incident', placeLabel: 'Location', descLabel: 'Description of the facts',
                catViolence: 'Violence', catDiscrim: 'Discrimination', catHarass: 'Harassment', catSafety: 'Safety', catTheft: 'Theft', catOther: 'Other',
                placePh: 'Select a location',
                plKitchen: 'Kitchen', plCounter: 'Counter / Register', plDining: 'Dining area', plDrive: 'Drive-thru', plLocker: 'Locker room', plStock: 'Stockroom', plParking: 'Parking lot', plOther: 'Other',
                descPh: 'Describe exactly what happened.',
                peopleLabel: 'People involved (optional)', peoplePh: 'Name(s), role(s)… (optional)',
                anonLabel: 'Anonymous report', anonHint: 'Your identity will not be shared with HR.',
                submit: 'Send report', required: '* Required fields',
                confirmTitle: 'Report sent', confirmMsg: 'Your report has been recorded and will be reviewed by our HR team.', refLabel: 'Reference', newReport: 'New report'
            },
            'en-GB': {
                title: 'Report an Incident', subtitle: 'Report an incident, confidentially',
                noticeTitle: 'Confidential', noticeBody: 'Your report goes straight to the HR team and is handled with the utmost confidentiality.',
                catLabel: 'Category', dateLabel: 'Date of the incident', placeLabel: 'Location', descLabel: 'Description of the facts',
                catViolence: 'Violence', catDiscrim: 'Discrimination', catHarass: 'Harassment', catSafety: 'Safety', catTheft: 'Theft', catOther: 'Other',
                placePh: 'Select a location',
                plKitchen: 'Kitchen', plCounter: 'Counter / Till', plDining: 'Dining area', plDrive: 'Drive-thru', plLocker: 'Locker room', plStock: 'Stockroom', plParking: 'Car park', plOther: 'Other',
                descPh: 'Describe exactly what happened.',
                peopleLabel: 'People involved (optional)', peoplePh: 'Name(s), role(s)… (optional)',
                anonLabel: 'Anonymous report', anonHint: 'Your identity will not be shared with HR.',
                submit: 'Send report', required: '* Required fields',
                confirmTitle: 'Report sent', confirmMsg: 'Your report has been recorded and will be reviewed by our HR team.', refLabel: 'Reference', newReport: 'New report'
            },
            'es': {
                title: 'Notificación', subtitle: 'Notifica un incidente de forma confidencial',
                noticeTitle: 'Confidencial', noticeBody: 'Tu notificación se envía directamente al equipo de RR. HH. y se trata con la máxima confidencialidad.',
                catLabel: 'Categoría', dateLabel: 'Fecha del incidente', placeLabel: 'Lugar', descLabel: 'Descripción de los hechos',
                catViolence: 'Violencia', catDiscrim: 'Discriminación', catHarass: 'Acoso', catSafety: 'Seguridad', catTheft: 'Robo', catOther: 'Otro',
                placePh: 'Selecciona un lugar',
                plKitchen: 'Cocina', plCounter: 'Mostrador / Caja', plDining: 'Sala', plDrive: 'Drive', plLocker: 'Vestuario', plStock: 'Almacén', plParking: 'Aparcamiento', plOther: 'Otro',
                descPh: 'Describe exactamente lo que pasó.',
                peopleLabel: 'Personas implicadas (opcional)', peoplePh: 'Nombre(s), función(es)… (opcional)',
                anonLabel: 'Notificación anónima', anonHint: 'Tu identidad no se comunicará a RR. HH.',
                submit: 'Enviar notificación', required: '* Campos obligatorios',
                confirmTitle: 'Notificación enviada', confirmMsg: 'Tu solicitud ha sido registrada y será analizada por nuestro equipo de RR. HH.', refLabel: 'Referencia', newReport: 'Nueva notificación'
            },
            'de': {
                title: 'Meldung', subtitle: 'Einen Vorfall vertraulich melden',
                noticeTitle: 'Vertraulich', noticeBody: 'Deine Meldung geht direkt an das HR-Team und wird streng vertraulich behandelt.',
                catLabel: 'Kategorie', dateLabel: 'Datum des Vorfalls', placeLabel: 'Ort', descLabel: 'Beschreibung des Vorfalls',
                catViolence: 'Gewalt', catDiscrim: 'Diskriminierung', catHarass: 'Belästigung', catSafety: 'Sicherheit', catTheft: 'Diebstahl', catOther: 'Sonstiges',
                placePh: 'Ort auswählen',
                plKitchen: 'Küche', plCounter: 'Theke / Kasse', plDining: 'Gastraum', plDrive: 'Drive-in', plLocker: 'Umkleide', plStock: 'Lager', plParking: 'Parkplatz', plOther: 'Sonstiges',
                descPh: 'Beschreibe genau, was passiert ist.',
                peopleLabel: 'Beteiligte Personen (optional)', peoplePh: 'Name(n), Rolle(n)… (optional)',
                anonLabel: 'Anonyme Meldung', anonHint: 'Deine Identität wird nicht an HR weitergegeben.',
                submit: 'Meldung senden', required: '* Pflichtfelder',
                confirmTitle: 'Meldung gesendet', confirmMsg: 'Deine Meldung wurde erfasst und wird von unserem HR-Team geprüft.', refLabel: 'Referenz', newReport: 'Neue Meldung'
            },
            'ja': {
                title: '通報', subtitle: 'インシデントを安心して通報',
                noticeTitle: '機密', noticeBody: '通報内容は人事チームに直接送られ、厳重に機密として扱われます。',
                catLabel: 'カテゴリー', dateLabel: '発生日', placeLabel: '場所', descLabel: '事実の説明',
                catViolence: '暴力', catDiscrim: '差別', catHarass: 'ハラスメント', catSafety: '安全', catTheft: '盗難', catOther: 'その他',
                placePh: '場所を選択',
                plKitchen: 'キッチン', plCounter: 'カウンター／レジ', plDining: '客席', plDrive: 'ドライブスルー', plLocker: '更衣室', plStock: '倉庫', plParking: '駐車場', plOther: 'その他',
                descPh: '何が起きたか具体的に説明してください。',
                peopleLabel: '関係者（任意）', peoplePh: '氏名・役職など（任意）',
                anonLabel: '匿名で通報', anonHint: 'あなたの身元は人事部に伝えられません。',
                submit: '通報を送信', required: '* 必須項目',
                confirmTitle: '通報を送信しました', confirmMsg: 'ご申告を受け付けました。人事部が確認いたします。', refLabel: '参照番号', newReport: '新しい通報'
            }
        };
        function pickLang() {
            const q = new URLSearchParams(location.search).get('lang');
            const raw = (q || document.documentElement.lang || navigator.language || 'fr');
            if (T[raw]) return raw;
            const base = raw.toLowerCase().split('-')[0];
            if (base === 'en') return /gb|uk/i.test(raw) ? 'en-GB' : 'en-US';
            return T[base] ? base : 'fr';
        }
        const LANG = pickLang();
        const t = T[LANG] || T['fr'];
        const LOCALE = { 'de':'de-DE','fr':'fr-FR','es':'es-ES','ja':'ja-JP','en-GB':'en-GB','en-US':'en-US' }[LANG];
        document.documentElement.lang = LANG;

        document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.dataset.i18n; if (t[k] !== undefined) el.textContent = t[k]; });
        document.querySelectorAll('[data-i18n-ph]').forEach(el => { const k = el.dataset.i18nPh; if (t[k] !== undefined) el.placeholder = t[k]; });

        /* categories */
        const svg = i => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + i + '</svg>';
        const CATS = [
            { key: 'catViolence', color: 'var(--bk-red)', icon: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>' },
            { key: 'catDiscrim', color: 'var(--bk-orange)', icon: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' },
            { key: 'catHarass', color: 'var(--purple)', icon: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" y1="8" x2="22" y2="13"/><line x1="22" y1="8" x2="17" y2="13"/>' },
            { key: 'catSafety', color: 'var(--bk-gold-deep)', icon: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>' },
            { key: 'catTheft', color: 'var(--bk-brown)', icon: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>' },
            { key: 'catOther', color: '#6b7280', icon: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>' }
        ];
        const state = { cat: null };
        const catsEl = document.getElementById('cats');
        catsEl.innerHTML = CATS.map(c =>
            '<button type="button" class="cat-chip" data-cat="' + c.key + '"><span class="ci" style="background:' + c.color + '">' + svg(c.icon) + '</span>' + t[c.key] + '</button>'
        ).join('');

        /* places */
        const PLACES = ['plKitchen','plCounter','plDining','plDrive','plLocker','plStock','plParking','plOther'];
        const placeEl = document.getElementById('f-place');
        placeEl.innerHTML = '<option value="" selected disabled>' + t.placePh + '</option>' +
            PLACES.map(p => '<option value="' + p + '">' + t[p] + '</option>').join('');

        /* date: default today, no future */
        const dateEl = document.getElementById('f-date');
        const today = new Date(); const pad = n => String(n).padStart(2,'0');
        const iso = today.getFullYear() + '-' + pad(today.getMonth()+1) + '-' + pad(today.getDate());
        dateEl.value = iso; dateEl.max = iso;

        const submitBtn = document.getElementById('submit');
        const descEl = document.getElementById('f-desc');
        function validate() {
            submitBtn.disabled = !(state.cat && dateEl.value && placeEl.value && descEl.value.trim());
        }
        descEl.addEventListener('input', validate);
        catsEl.addEventListener('click', e => {
            const b = e.target.closest('[data-cat]'); if (!b) return;
            state.cat = b.dataset.cat;
            catsEl.querySelectorAll('.cat-chip').forEach(x => x.classList.toggle('sel', x === b));
            validate();
        });
        dateEl.addEventListener('change', validate);
        placeEl.addEventListener('change', validate);

        submitBtn.addEventListener('click', () => {
            if (submitBtn.disabled) return;
            const ref = 'SIG-' + (Math.floor(Math.random() * 900000) + 100000);
            document.getElementById('ref-num').textContent = ref;
            document.getElementById('form-view').style.display = 'none';
            document.getElementById('confirm-view').style.display = 'block';
            window.scrollTo(0, 0);
        });

        document.getElementById('new-report').addEventListener('click', () => {
            state.cat = null;
            catsEl.querySelectorAll('.cat-chip').forEach(x => x.classList.remove('sel'));
            dateEl.value = iso; placeEl.selectedIndex = 0;
            descEl.value = ''; document.getElementById('f-people').value = ''; document.getElementById('f-anon').checked = false;
            validate();
            document.getElementById('confirm-view').style.display = 'none';
            document.getElementById('form-view').style.display = 'block';
            window.scrollTo(0, 0);
        });
    })();
    </script>
</body>
</html>
