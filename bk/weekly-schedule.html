<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="widget-name" content="My Schedule">
<meta name="widget-description" content="Personal weekly shift schedule with hours, location and one-tap export.">
<meta name="widget-tags" content="Scheduling, HR Data">
<title>My Schedule</title>

<style>
    /* Palette + tokens taken verbatim from the source design (Schedule.tsx + theme.css).
       No --sb-brand inheritance — colours are fixed to the source. */
    :root {
        --red: #D62300;
        --red-dark: #B01E00;
        --gold: #F5BD1F;
        --gold-dark: #D4A619;
        --orange: #FF8732;

        --page-bg: #FCF6E0;        /* BK cream — matches the other widgets */
        --card-bg: #FFFFFF;
        --text: #111827;           /* gray-900 */
        --text-muted: #4B5563;     /* gray-600 */
        --border-soft: #E5E7EB;    /* gray-200 */

        --tint-red: #FEF2F2;       /* tailwind red-50 */
        --tint-gold: #FEFCE8;      /* tailwind yellow-50 */
        --tint-orange: #FFF7ED;    /* tailwind orange-50 */

        /* radii — source theme --radius: 0.625rem (10px) */
        --r-md: 8px;               /* rounded-md  → buttons, badges */
        --r-lg: 10px;              /* rounded-lg  → icon tiles */
        --r-xl: 14px;              /* rounded-xl  → cards */
        --r-2xl: 16px;             /* rounded-2xl → header */

        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    }
    /* Dark-mode adaptation removed on purpose: this widget stays on the light
       BK cream theme to match "Mes docs" and "Boîte à idées". */

    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--page-bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
    }

    .widget {
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    /* --- Header card (bg-[#D62300] p-4 rounded-2xl shadow-lg) --- */
    .plan-header {
        background: var(--red);
        color: #fff;
        padding: 16px;
        border-radius: var(--r-2xl);
        box-shadow: var(--shadow-lg);
    }
    .plan-title {
        margin: 0;
        font-size: 20px;          /* text-xl */
        font-weight: 700;
        line-height: 1.4;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .plan-range {
        margin: 4px 0 0 0;        /* mt-1 */
        font-size: 14px;          /* text-sm */
        opacity: 0.9;
    }

    /* --- Week navigation (flex justify-between gap-2) --- */
    .week-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }
    .nav-btn {
        width: 40px;
        height: 36px;             /* h-9 */
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--red);
        color: var(--red);
        background: var(--card-bg);
        border-radius: var(--r-md);
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
    }
    .nav-btn:hover { background: var(--red); color: #fff; }
    .nav-btn svg { width: 16px; height: 16px; }
    .week-label {
        font-size: 14px;          /* text-sm */
        font-weight: 700;
        color: var(--text);
        text-align: center;
    }

    /* --- Summary / stat cards (Card p-3 border-2 rounded-xl) --- */
    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }
    .stat-card {
        border: 2px solid var(--border-soft);
        border-radius: var(--r-xl);
        padding: 12px;
        text-align: center;
    }
    .stat-total { border-color: var(--red);    background: linear-gradient(to bottom right, var(--card-bg), var(--tint-red)); }
    .stat-days  { border-color: var(--gold);   background: linear-gradient(to bottom right, var(--card-bg), var(--tint-gold)); }
    .stat-site  { border-color: var(--orange); background: linear-gradient(to bottom right, var(--card-bg), var(--tint-orange)); }

    .stat-icon {
        width: 32px;              /* p-2 (8px) around a 16px icon */
        height: 32px;
        border-radius: var(--r-lg);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;       /* mb-2 */
    }
    .stat-icon svg { width: 16px; height: 16px; }
    .stat-total .stat-icon { background: var(--red);    color: #fff; }
    .stat-days  .stat-icon { background: var(--gold);   color: var(--red); }
    .stat-site  .stat-icon { background: var(--orange); color: #fff; }

    .stat-label {
        font-size: 12px;          /* text-xs */
        font-weight: 600;
        color: var(--text-muted);
        margin: 0 0 4px 0;        /* mb-1 */
    }
    .stat-value { font-size: 18px; font-weight: 700; line-height: 1.4; margin: 0; }   /* text-lg */
    .stat-total .stat-value,
    .stat-days  .stat-value { color: var(--red); }
    .stat-site  .stat-value { color: var(--orange); font-size: 16px; }  /* bumped from source text-xs (12px) for visual balance with the other two values */

    /* --- Shift list (space-y-3) --- */
    .shift-list { display: flex; flex-direction: column; gap: 12px; }
    .shift-card {
        display: flex;
        gap: 12px;                /* gap-3 */
        background: var(--card-bg);
        border: 2px solid var(--border-soft);
        border-radius: var(--r-xl);
        padding: 12px;            /* p-3 */
        box-shadow: var(--shadow-md);
    }
    .shift-card.today {
        border-color: var(--red);
        background: linear-gradient(to right, var(--tint-red), var(--card-bg));
    }
    .shift-date { min-width: 50px; text-align: center; }
    .shift-day   { font-size: 12px; font-weight: 700; color: var(--text-muted); }
    .shift-num   { font-size: 24px; font-weight: 700; color: var(--red); line-height: 1.3; }  /* text-2xl */
    .shift-month { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    /* "Today" highlight: red border + tint + a red "Today" label that replaces the
       weekday on the same line, so the date column keeps the exact height of other cards. */
    .shift-card.today .shift-day { color: var(--red); }
    .shift-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;                 /* space-y-2 */
        justify-content: center;
    }
    .shift-time-row { display: flex; align-items: center; gap: 6px; color: var(--text); }
    .shift-time-row svg { width: 16px; height: 16px; color: var(--red); flex-shrink: 0; }
    .shift-time { font-size: 14px; font-weight: 700; }   /* text-sm */
    .shift-dur  { font-size: 12px; font-weight: 600; color: var(--text-muted); }   /* text-xs */
    .role-badge {
        align-self: flex-start;
        border: 1px solid var(--gold);
        color: var(--red);
        background: transparent;
        font-size: 12px;          /* text-xs */
        font-weight: 600;
        padding: 2px 8px;         /* py-0.5 px-2 */
        border-radius: var(--r-md);
    }

    /* --- Export button (Button w-full gradient shadow-lg) --- */
    .export-btn {
        width: 100%;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: linear-gradient(to right, var(--red), var(--gold));
        color: #fff;
        border: none;
        border-radius: var(--r-md);
        padding: 8px 16px;
        font-family: inherit;
        font-size: 14px;          /* text-sm */
        font-weight: 700;
        cursor: pointer;
        box-shadow: var(--shadow-lg);
        transition: filter 0.15s;
    }
    .export-btn:hover { background: linear-gradient(to right, var(--red-dark), var(--gold-dark)); }
    .export-btn svg { width: 16px; height: 16px; }

    /* --- Toast --- */
    .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(8px);
        background: #111827;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 16px;
        border-radius: 9px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<body>

<div class="widget">
    <!-- Header -->
    <div class="plan-header">
        <h2 class="plan-title"><span data-i18n="title">Mon Planning</span> <span aria-hidden="true">📅</span></h2>
        <p class="plan-range" id="weekRange"></p>
    </div>

    <!-- Week navigation -->
    <div class="week-nav">
        <button class="nav-btn" id="prevWeek" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="week-label" id="weekLabel"></span>
        <button class="nav-btn" id="nextWeek" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
    </div>

    <!-- Summary cards -->
    <div class="stats">
        <div class="stat-card stat-total">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <p class="stat-label" data-i18n="total">Total</p>
            <p class="stat-value" id="statTotal">40h00</p>
        </div>
        <div class="stat-card stat-days">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <p class="stat-label" data-i18n="days">Jours</p>
            <p class="stat-value" id="statDays">5</p>
        </div>
        <div class="stat-card stat-site">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <p class="stat-label" data-i18n="site">Site</p>
            <p class="stat-value stat-site-value">Opéra</p>
        </div>
    </div>

    <!-- Shift list -->
    <div class="shift-list" id="shiftList"></div>

    <!-- Export -->
    <button class="export-btn" id="exportBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span data-i18n="export">Exporter le planning</span>
    </button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
    // --- Language detection (per widgets/MULTILANGUAGE.md) ---
    const LANG = (() => {
        const q = new URLSearchParams(location.search).get('lang');
        const l = q || navigator.language || '';
        if (l.startsWith('de')) return 'de';
        if (l.startsWith('fr')) return 'fr';
        if (l.startsWith('es')) return 'es';
        if (l.startsWith('ja')) return 'ja';
        if (l === 'en-GB')      return 'en-GB';
        if (l.startsWith('en')) return 'en-US';
        return 'fr';
    })();
    document.documentElement.lang = LANG;

    const LOCALE = {
        'de': 'de-DE', 'fr': 'fr-FR', 'es': 'es-ES',
        'ja': 'ja-JP', 'en-GB': 'en-GB', 'en-US': 'en-US'
    }[LANG];
    const HOUR12 = LANG === 'en-GB' || LANG === 'en-US';

    // --- Translations ---
    const T = {
        de: {
            title: 'Mein Dienstplan',
            description: 'Persoenlicher Wochendienstplan mit Stunden, Standort und Export.',
            currentWeek: 'Aktuelle Woche',
            weekOf: 'Woche vom ${date}',
            total: 'Gesamt', days: 'Tage', site: 'Standort',
            role: 'Schichtleiter',
            export: 'Dienstplan exportieren',
            today: 'Heute',
            exported: 'Dienstplan exportiert',
            prevWeek: 'Vorherige Woche', nextWeek: 'Naechste Woche',
        },
        fr: {
            title: 'Mon Planning',
            description: 'Planning hebdomadaire personnel avec heures, site et export.',
            currentWeek: 'Semaine actuelle',
            weekOf: 'Semaine du ${date}',
            total: 'Total', days: 'Jours', site: 'Site',
            role: 'Manager de service',
            export: 'Exporter le planning',
            today: 'Auj.',
            exported: 'Planning exporte',
            prevWeek: 'Semaine precedente', nextWeek: 'Semaine suivante',
        },
        es: {
            title: 'Mi horario',
            description: 'Horario semanal personal con horas, centro y exportacion.',
            currentWeek: 'Semana actual',
            weekOf: 'Semana del ${date}',
            total: 'Total', days: 'Dias', site: 'Centro',
            role: 'Encargado de turno',
            export: 'Exportar horario',
            today: 'Hoy',
            exported: 'Horario exportado',
            prevWeek: 'Semana anterior', nextWeek: 'Semana siguiente',
        },
        ja: {
            title: '勤務シフト',
            description: '勤務時間・勤務地・エクスポート機能付きの週間シフト表。',
            currentWeek: '今週',
            weekOf: '${date}の週',
            total: '合計', days: '日数', site: '勤務地',
            role: 'サービスマネージャー',
            export: 'シフトをエクスポート',
            today: '今日',
            exported: 'シフトをエクスポートしました',
            prevWeek: '前の週', nextWeek: '次の週',
        },
        'en-GB': {
            title: 'My Schedule',
            description: 'Personal weekly shift schedule with hours, site and export.',
            currentWeek: 'Current week',
            weekOf: 'Week of ${date}',
            total: 'Total', days: 'Days', site: 'Site',
            role: 'Service Manager',
            export: 'Export schedule',
            today: 'Today',
            exported: 'Schedule exported',
            prevWeek: 'Previous week', nextWeek: 'Next week',
        },
        'en-US': {
            title: 'My Schedule',
            description: 'Personal weekly shift schedule with hours, location and export.',
            currentWeek: 'Current week',
            weekOf: 'Week of ${date}',
            total: 'Total', days: 'Days', site: 'Location',
            role: 'Service Manager',
            export: 'Export schedule',
            today: 'Today',
            exported: 'Schedule exported',
            prevWeek: 'Previous week', nextWeek: 'Next week',
        },
    };
    const t = T[LANG] ?? T['en-US'];

    function tr(key, vars = {}) {
        let s = t[key] || key;
        for (const [k, v] of Object.entries(vars)) s = s.replace('${' + k + '}', v);
        return s;
    }

    // --- Date helpers (everything anchored to today, so it always feels current) ---
    const now = new Date();
    let weekOffset = 0;          // 0 = current week
    let currentWeekData = null;  // cached for the export

    // Monday of the week containing `date` (ISO week start).
    function mondayOf(date) {
        const d = new Date(date);
        const back = (d.getDay() + 6) % 7;   // 0 = Mon ... 6 = Sun
        d.setDate(d.getDate() - back);
        d.setHours(0, 0, 0, 0);
        return d;
    }

    // Worked days as offsets from Monday + their shift times.
    // Mirrors the source pattern: five 8h shifts, two rest days (Thu + Sun).
    const SHIFT_PATTERN = [
        { offset: 0, start: '09:00', end: '17:00' }, // Mon
        { offset: 1, start: '14:00', end: '22:00' }, // Tue
        { offset: 2, start: '10:00', end: '18:00' }, // Wed
        { offset: 4, start: '09:00', end: '17:00' }, // Fri
        { offset: 5, start: '09:00', end: '17:00' }, // Sat
    ];

    function buildWeek(offset) {
        const monday = mondayOf(now);
        monday.setDate(monday.getDate() + offset * 7);
        const weekEnd = new Date(monday);
        weekEnd.setDate(weekEnd.getDate() + 6);
        const shifts = SHIFT_PATTERN.map(p => {
            const date = new Date(monday);
            date.setDate(date.getDate() + p.offset);
            return { date, start: p.start, end: p.end };
        });
        return { weekStart: monday, weekEnd, shifts };
    }

    // --- Formatters ---
    const dayFmt   = new Intl.DateTimeFormat(LOCALE, { weekday: 'short' });
    const monthFmt = new Intl.DateTimeFormat(LOCALE, { month: 'short' });
    const rangeFmt = new Intl.DateTimeFormat(LOCALE, { day: 'numeric', month: 'short', year: 'numeric' });
    const weekOfFmt = new Intl.DateTimeFormat(LOCALE, { day: 'numeric', month: 'long' });
    const timeFmt  = new Intl.DateTimeFormat(LOCALE, { hour: 'numeric', minute: '2-digit', hour12: HOUR12 });

    // Capitalise the first letter and drop a trailing abbreviation period
    // (Intl gives "lun." / "sam." for fr; the source design shows "Lun" / "Sam").
    const dayLabel = d => {
        const s = dayFmt.format(d).replace(/\.$/, '');
        return s.charAt(0).toUpperCase() + s.slice(1);
    };

    function atTime(date, hhmm) {
        const [h, m] = hhmm.split(':').map(Number);
        const d = new Date(date);
        d.setHours(h, m, 0, 0);
        return d;
    }
    function fmtTime(date, hhmm) { return timeFmt.format(atTime(date, hhmm)); }

    function durationMinutes(start, end) {
        const [sh, sm] = start.split(':').map(Number);
        const [eh, em] = end.split(':').map(Number);
        return (eh * 60 + em) - (sh * 60 + sm);
    }
    function fmtDuration(min) {            // "8h" (minutes omitted when zero)
        const h = Math.floor(min / 60), m = min % 60;
        return h + 'h' + (m > 0 ? String(m).padStart(2, '0') : '');
    }
    function fmtTotal(min) {               // "40h00" (minutes always shown)
        const h = Math.floor(min / 60), m = min % 60;
        return h + 'h' + String(m).padStart(2, '0');
    }

    // --- Render ---
    function render() {
        const data = buildWeek(weekOffset);
        currentWeekData = data;
        const { weekStart, weekEnd, shifts } = data;

        document.getElementById('weekRange').textContent = rangeFmt.formatRange(weekStart, weekEnd);
        document.getElementById('weekLabel').textContent =
            weekOffset === 0 ? t.currentWeek : tr('weekOf', { date: weekOfFmt.format(weekStart) });

        const totalMin = shifts.reduce((sum, s) => sum + durationMinutes(s.start, s.end), 0);
        document.getElementById('statTotal').textContent = fmtTotal(totalMin);
        document.getElementById('statDays').textContent = shifts.length;

        const todayStr = new Date().toDateString();
        document.getElementById('shiftList').innerHTML = shifts.map(s => {
            const isToday = s.date.toDateString() === todayStr;
            const dur = fmtDuration(durationMinutes(s.start, s.end));
            return (
                '<div class="shift-card' + (isToday ? ' today' : '') + '">' +
                    '<div class="shift-date">' +
                        '<div class="shift-day">' + (isToday ? t.today : dayLabel(s.date)) + '</div>' +
                        '<div class="shift-num">' + s.date.getDate() + '</div>' +
                        '<div class="shift-month">' + monthFmt.format(s.date) + '</div>' +
                    '</div>' +
                    '<div class="shift-info">' +
                        '<div class="shift-time-row">' +
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
                            '<span class="shift-time">' + fmtTime(s.date, s.start) + ' - ' + fmtTime(s.date, s.end) + '</span>' +
                            '<span class="shift-dur">(' + dur + ')</span>' +
                        '</div>' +
                        '<span class="role-badge">' + t.role + '</span>' +
                    '</div>' +
                '</div>'
            );
        }).join('');
    }

    // --- Toast ---
    let toastTimer = null;
    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    // --- Export the displayed week as an .ics calendar file ---
    function pad(n) { return String(n).padStart(2, '0'); }
    function icsStamp(d) {
        return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) +
               'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
    }
    function icsLocal(d) {   // floating local time (no timezone) — fine for a demo
        return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
               'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
    }
    function exportICS() {
        if (!currentWeekData) return;
        const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Staffbase//My Schedule//EN', 'CALSCALE:GREGORIAN'];
        const stamp = icsStamp(new Date());
        currentWeekData.shifts.forEach((s, i) => {
            lines.push('BEGIN:VEVENT');
            lines.push('UID:shift-' + Date.now() + '-' + i + '@staffbase-widget');
            lines.push('DTSTAMP:' + stamp);
            lines.push('DTSTART:' + icsLocal(atTime(s.date, s.start)));
            lines.push('DTEND:' + icsLocal(atTime(s.date, s.end)));
            lines.push('SUMMARY:' + t.role + ' - Opéra');
            lines.push('LOCATION:Opéra');
            lines.push('END:VEVENT');
        });
        lines.push('END:VCALENDAR');
        const ics = lines.join('\r\n');
        const filename = ({
            de: 'dienstplan.ics', fr: 'planning.ics', es: 'horario.ics',
            ja: 'shift.ics', 'en-GB': 'schedule.ics', 'en-US': 'schedule.ics'
        })[LANG] || 'schedule.ics';
        downloadICS(ics, filename);
        showToast(t.exported);
    }

    // Robust .ics delivery: a normal file download at top level; inside the
    // Staffbase in-app webview / iframe (where anchor downloads are usually
    // blocked) open the calendar file so the phone can add the events.
    function downloadICS(ics, filename) {
        var inIframe = false;
        try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
        if (inIframe) {
            var dataUri = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
            var win = window.open(dataUri, '_blank');
            if (!win) location.href = dataUri;
            return;
        }
        var blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename; a.rel = 'noopener';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 8000);
    }

    // --- Static translations + init ---
    function applyTranslations() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.dataset.i18n;
            if (t[key] !== undefined) el.textContent = t[key];
        });
    }

    function init() {
        applyTranslations();
        const prev = document.getElementById('prevWeek');
        const next = document.getElementById('nextWeek');
        prev.setAttribute('aria-label', t.prevWeek);
        next.setAttribute('aria-label', t.nextWeek);
        prev.addEventListener('click', () => { weekOffset -= 1; render(); });
        next.addEventListener('click', () => { weekOffset += 1; render(); });
        document.getElementById('exportBtn').addEventListener('click', exportICS);
        render();
    }

    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
